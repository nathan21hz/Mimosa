<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimosa Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1d2329;
    --muted: #6b7480;
    --accent: #2f6fdf;
    --accent-text: #ffffff;
    --green: #1f8a4c;
    --green-bg: #e3f4ea;
    --blue: #2f6fdf;
    --blue-bg: #e4ecfb;
    --gray: #6b7480;
    --gray-bg: #eceef1;
    --red: #c93a32;
    --red-bg: #fbe7e5;
    --amber: #a86b00;
    --code-bg: #f1f3f5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b;
      --panel: #1c2026;
      --border: #2c323a;
      --text: #e6e9ed;
      --muted: #8d96a1;
      --accent: #5b8ff0;
      --accent-text: #0e1116;
      --green: #4cc483;
      --green-bg: #183326;
      --blue: #6e9cf3;
      --blue-bg: #1c2a44;
      --gray: #98a1ab;
      --gray-bg: #272c33;
      --red: #f0726a;
      --red-bg: #3a1f1d;
      --amber: #e0a63a;
      --code-bg: #232830;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  .spacer { flex: 1; }
  #refresh-state { color: var(--muted); font-size: 13px; }
  #refresh-state.error { color: var(--red); }

  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat.bad .value { color: var(--red); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  td.nowrap { white-space: nowrap; }
  td.task { min-width: 140px; }
  td.result { max-width: 360px; }
  tr:last-child td { border-bottom: none; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12px; }
  .schedule code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }

  .badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.green { color: var(--green); background: var(--green-bg); }
  .badge.blue { color: var(--blue); background: var(--blue-bg); }
  .badge.blue::before { animation: pulse 1s ease-in-out infinite; }
  .badge.gray { color: var(--gray); background: var(--gray-bg); }
  .badge.red { color: var(--red); background: var(--red-bg); }
  @keyframes pulse { 50% { opacity: .25; } }

  .result-ok { color: var(--green); }
  .result-quiet { color: var(--muted); }
  .result-fail { color: var(--red); }
  .error-text { color: var(--red); font-size: 12px; word-break: break-all; }
  .result .error-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .data {
    display: block;
    max-width: 320px;
    background: var(--code-bg);
    border-radius: 4px;
    padding: 4px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .data.expanded { white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
  .actions { display: flex; gap: 6px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }

  details.logs { margin-top: 20px; }
  details.logs summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
  #logs {
    margin: 0;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    max-height: 360px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #logs .ERROR { color: var(--red); }
  #logs .WARNING { color: var(--amber); }
  #logs .DEBUG { color: var(--muted); }

  dialog {
    width: min(1180px, calc(100vw - 32px));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0;
    background: var(--panel);
    color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  .dialog-head { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; word-break: break-all; }
  .dialog-body { padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
  #editor {
    width: 100%;
    height: min(60vh, 560px);
    resize: vertical;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--code-bg);
    color: var(--text);
    tab-size: 4;
  }
  #editor-error { min-height: 20px; margin-top: 8px; }
  .dialog-body.has-result #editor { height: min(36vh, 360px); }
  .dry-run { border: 1px solid var(--border); border-radius: 6px; max-height: 42vh; overflow: auto; }
  .dr-summary { padding: 8px 10px; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .dr-summary.ok { color: var(--green); }
  .dr-summary.fail { color: var(--red); }
  .dr-meta { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
  .dr-step { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .dr-step:last-child { border-bottom: none; }
  .dr-head { font-weight: 600; }
  .dr-head::before { content: "✓ "; color: var(--green); }
  .dr-step.fail .dr-head::before { content: "✗ "; color: var(--red); }
  .dr-step.skip .dr-head { color: var(--muted); font-weight: 400; }
  .dr-step.skip .dr-head::before { content: "– "; color: var(--muted); }
  .dr-line { font-size: 12px; word-break: break-all; margin-top: 2px; }
  .dr-line .bad { color: var(--red); }
  .dr-line .good { color: var(--green); }
  .dr-warn { color: var(--amber); }
  .dr-pre { white-space: pre-wrap; word-break: break-all; background: var(--code-bg); padding: 6px 8px; border-radius: 4px; max-height: 220px; overflow: auto; margin: 4px 0 0; }
  .bookmarks { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-height: calc(min(60vh, 560px) + 28px); }
  .bm-head { font-weight: 600; }
  .bm-save { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .bm-save-row { display: flex; gap: 6px; }
  .bm-save select, .bm-save input {
    font: inherit;
    min-width: 0;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
  }
  .bm-save input { flex: 1; }
  #bm-status { min-height: 18px; font-size: 12px; color: var(--muted); }
  #bm-status.error { color: var(--red); }
  .bm-list { overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .bm-item { border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
  .bm-item-head { display: flex; align-items: center; gap: 6px; }
  .bm-name { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
  .bm-kind { font-size: 11px; color: var(--muted); background: var(--gray-bg); border-radius: 4px; padding: 0 6px; }
  .bm-preview { margin: 4px 0 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm-actions { display: flex; gap: 6px; }
  .bm-actions button { padding: 2px 8px; font-size: 12px; }
  .bm-empty { color: var(--muted); font-size: 12px; }
  .dialog-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); align-items: center; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--red); color: #fff; }

  /* cards on narrow screens */
  @media (max-width: 900px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border-bottom: 1px solid var(--border); padding: 8px 0; }
    tr:last-child { border-bottom: none; }
    td { border: none; padding: 4px 14px; }
    td.nowrap, td.result { white-space: normal; max-width: none; }
    .actions { flex-wrap: wrap; }
    td[data-label]::before { content: attr(data-label); display: block; color: var(--muted); font-size: 12px; }
    .data { max-width: 100%; }
    .dialog-body { grid-template-columns: 1fr; }
    .bookmarks { max-height: 320px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mimosa<span>任务面板</span></h1>
    <div class="spacer"></div>
    <span id="refresh-state">加载中…</span>
    <button id="add-task" title="新建一个任务并写入任务文件">新增任务</button>
    <button id="reload-all" class="primary" title="重载全部插件模块和任务文件">重载全部</button>
  </header>

  <section class="stats" id="stats"></section>

  <section class="panel">
    <table>
      <thead>
        <tr><th>任务</th><th>状态</th><th>上次运行</th><th>下次运行</th><th>最近结果</th><th>最新数据</th><th>操作</th></tr>
      </thead>
      <tbody id="tasks"></tbody>
    </table>
  </section>

  <details class="panel logs" id="logs-panel" open>
    <summary>最近日志</summary>
    <pre id="logs" class="mono"></pre>
  </details>
</div>

<dialog id="edit-dialog">
  <div class="dialog-head" id="edit-title">编辑任务</div>
  <div class="dialog-body">
    <div>
      <textarea id="editor" class="mono" spellcheck="false"></textarea>
      <div id="editor-error" class="error-text"></div>
      <div id="dry-run" class="dry-run" hidden></div>
    </div>
    <aside class="bookmarks">
      <div class="bm-head">书签</div>
      <div class="bm-save">
        <select id="bm-module" title="从当前配置中选择要收藏的模块"></select>
        <div class="bm-save-row">
          <input id="bm-name" maxlength="100" placeholder="书签名称">
          <button id="bm-add">收藏</button>
        </div>
        <div id="bm-status"></div>
      </div>
      <div id="bm-list" class="bm-list"></div>
    </aside>
  </div>
  <div class="dialog-foot">
    <span class="sub" id="edit-hint"></span>
    <div class="spacer"></div>
    <button id="edit-dry-run" title="用当前配置运行到推送之前，不推送、不写历史（Ctrl+Enter）">试运行</button>
    <button id="edit-format">格式化</button>
    <button id="edit-cancel">取消</button>
    <button id="edit-save" class="primary">保存</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const REFRESH_MS = 3000;
const TOKEN_KEY = "mimosa-token";
const expanded = new Set();   // task names whose data cell is expanded
let editingName = null;
let taskNames = new Set();   // names of all tasks, for naming copies
let refreshTimer = null;
let lastRefresh = 0;

// ---------- helpers ----------

function storageGet(key) {
  try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
}

async function api(method, path, body) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const options = { method, headers: { "X-Token": storageGet(TOKEN_KEY) } };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const res = await fetch(path, options);
    if (res.status === 401 && attempt === 0) {
      const token = prompt("请输入 Dashboard Token（config.json 中的 DASHBOARD_TOKEN）");
      if (token === null) break;
      storageSet(TOKEN_KEY, token);
      continue;
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
    return data;
  }
  throw new Error("未授权");
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null) node.setAttribute(key, value);
  }
  for (const child of children) {
    if (child === null || child === undefined) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

function formatAbsolute(ts) {
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function formatRelative(ts) {
  const diff = Math.round(ts - Date.now() / 1000);
  const abs = Math.abs(diff);
  let text;
  if (abs < 5) return diff >= 0 ? "即将" : "刚刚";
  if (abs < 60) text = abs + " 秒";
  else if (abs < 3600) text = Math.round(abs / 60) + " 分钟";
  else if (abs < 86400) text = Math.round(abs / 3600) + " 小时";
  else text = Math.round(abs / 86400) + " 天";
  return diff > 0 ? text + "后" : text + "前";
}

function timeCell(ts) {
  if (!ts) return el("span", { class: "sub" }, "—");
  return el("span", { title: formatAbsolute(ts) }, formatRelative(ts));
}

function formatSchedule(task) {
  if (task.cron) return el("code", {}, task.cron);
  if (task.interval !== null && task.interval !== undefined) return "每 " + task.interval + " 秒";
  return "";
}

let toastTimer = null;
function toast(message, isError) {
  const node = document.getElementById("toast");
  node.textContent = message;
  node.className = "show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { node.className = isError ? "error" : ""; }, isError ? 5000 : 2500);
}

// ---------- rendering ----------

function statusBadge(task) {
  if (task.invalid) return el("span", { class: "badge red" }, "配置无效");
  if (task.busy) return el("span", { class: "badge blue" }, "执行中");
  if (task.running) return el("span", { class: "badge green" }, "运行中");
  return el("span", { class: "badge gray" }, "已暂停");
}

function resultCell(task) {
  if (task.invalid) return el("div", { class: "error-text" }, task.invalid);
  const result = task.result;
  if (!result) return el("span", { class: "sub" }, "—");
  const when = el("div", { class: "sub", title: formatAbsolute(result.time) }, formatRelative(result.time));
  if (!result.ok) {
    return el("div", {},
      el("span", { class: "result-fail" }, "失败"), when,
      el("div", { class: "error-text", title: result.error }, result.error.length > 160 ? result.error.slice(0, 160) + "…" : result.error));
  }
  return el("div", {},
    result.pushed ? el("span", { class: "result-ok" }, "成功 · 已推送") : el("span", { class: "result-quiet" }, "成功 · 未触发"),
    when);
}

function dataCell(task) {
  if (task.invalid) return el("span", { class: "sub" }, "—");
  const isExpanded = expanded.has(task.name);
  const text = isExpanded ? JSON.stringify(task.data, null, 2) : JSON.stringify(task.data);
  return el("code", {
    class: "data" + (isExpanded ? " expanded" : ""),
    title: isExpanded ? "点击收起" : "点击展开",
    onclick: () => {
      if (expanded.has(task.name)) expanded.delete(task.name); else expanded.add(task.name);
      refresh();
    },
  }, text);
}

function actionButton(label, handler, extraClass) {
  const button = el("button", { class: extraClass || "" }, label);
  button.addEventListener("click", async () => {
    button.disabled = true;
    try { await handler(); } finally { button.disabled = false; }
  });
  return button;
}

function actionsCell(task) {
  const name = task.name;
  const path = "/api/tasks/" + encodeURIComponent(name);
  const buttons = [];
  if (!task.invalid) {
    buttons.push(task.running
      ? actionButton("暂停", () => runAction("POST", path + "/stop", "已暂停：" + name))
      : actionButton("启动", () => runAction("POST", path + "/start", "已启动：" + name)));
    buttons.push(actionButton("清空历史", () => {
      if (!confirm(`清空「${name}」的历史数据？\n历史会恢复为初始数据，运行中的任务会立即重新执行一次。`)) return;
      return runAction("POST", path + "/clear", "已清空历史：" + name);
    }, "danger"));
  }
  buttons.push(actionButton("编辑", () => openEditor(name)));
  buttons.push(actionButton("复制", () => openCopy(name)));
  return el("div", { class: "actions" }, ...buttons);
}

function renderStats(tasks) {
  const valid = tasks.filter(t => !t.invalid);
  const items = [
    ["任务总数", tasks.length, false],
    ["运行中", valid.filter(t => t.running).length, false],
    ["已暂停", valid.filter(t => !t.running).length, false],
    ["最近失败", valid.filter(t => t.result && !t.result.ok).length, true],
  ];
  const invalid = tasks.length - valid.length;
  if (invalid) items.push(["配置无效", invalid, true]);
  document.getElementById("stats").replaceChildren(...items.map(([label, value, warn]) =>
    el("div", { class: "stat" + (warn && value ? " bad" : "") },
      el("div", { class: "label" }, label),
      el("div", { class: "value" }, value))));
}

function renderTasks(tasks) {
  const body = document.getElementById("tasks");
  if (!tasks.length) {
    body.replaceChildren(el("tr", {}, el("td", { colspan: 7, class: "empty" }, "还没有任务，点击右上角「新增任务」创建")));
    return;
  }
  body.replaceChildren(...tasks.map(task => el("tr", {},
    el("td", { class: "task" }, el("div", { class: "name" }, task.name), el("div", { class: "sub schedule" }, task.invalid ? "" : formatSchedule(task))),
    el("td", { "data-label": "状态", class: "nowrap" }, statusBadge(task)),
    el("td", { "data-label": "上次运行", class: "nowrap" }, task.invalid ? "—" : timeCell(task.last_run)),
    el("td", { "data-label": "下次运行", class: "nowrap" }, task.invalid ? "—" : (task.running ? timeCell(task.next_run) : el("span", { class: "sub" }, "已暂停"))),
    el("td", { "data-label": "最近结果", class: "result" }, resultCell(task)),
    el("td", { "data-label": "最新数据" }, dataCell(task)),
    el("td", {}, actionsCell(task)))));
}

function renderLogs(text) {
  const pre = document.getElementById("logs");
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 20;
  pre.replaceChildren(...text.split("\n").filter(Boolean).map(line => {
    const level = (line.match(/\]\[(DEBUG|INFO|WARNING|ERROR|CRITICAL)\]/) || [])[1] || "";
    return el("div", { class: level === "CRITICAL" ? "ERROR" : level }, line);
  }));
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

// ---------- data flow ----------

async function refresh() {
  clearTimeout(refreshTimer);
  const state = document.getElementById("refresh-state");
  try {
    const [tasks, logs] = await Promise.all([api("GET", "/api/tasks"), api("GET", "/api/logs")]);
    taskNames = new Set(tasks.map(t => t.name));
    renderStats(tasks);
    renderTasks(tasks);
    renderLogs(logs.logs);
    lastRefresh = Date.now();
    state.className = "";
    state.textContent = "已更新 " + formatAbsolute(lastRefresh / 1000).slice(11);
  } catch (e) {
    state.className = "error";
    state.textContent = "刷新失败：" + e.message;
  }
  if (!document.hidden) refreshTimer = setTimeout(refresh, REFRESH_MS);
}

async function runAction(method, path, successMessage) {
  try {
    await api(method, path);
    toast(successMessage);
  } catch (e) {
    toast(e.message, true);
  }
  await refresh();
}

document.getElementById("reload-all").addEventListener("click", async (event) => {
  if (!confirm("重载全部插件模块和任务文件？\n会先等待执行中的任务结束；任务的启动/暂停状态会恢复为任务文件中的设置。")) return;
  const button = event.currentTarget;
  button.disabled = true;
  button.textContent = "重载中…";
  try {
    await runAction("POST", "/api/reload", "重载完成");
  } finally {
    button.disabled = false;
    button.textContent = "重载全部";
  }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// ---------- editor ----------

const dialog = document.getElementById("edit-dialog");
const editor = document.getElementById("editor");
const editorError = document.getElementById("editor-error");

// filled in when adding a task; see README for all fields
const NEW_TASK_TEMPLATE = {
  name: "new_task",
  type: "static",
  cron: "*/10 * * * *",
  startup_data: [""],
  source: { type: "no_auth", url: "https://example.com/", method: "GET", payload: "" },
  data: [{ type: "xpath", xpath: "//title/text()", index: 0 }],
  condition: [{ conn: "and", var: "$0", op: "!=", target: "#0" }],
  push: { type: "telegram", bot_token: "", to: "", text: "{0}" },
};

// name: task being edited, null when adding a new task
function showEditor(name, title, hint, config) {
  editingName = name;
  document.getElementById("edit-title").textContent = title;
  document.getElementById("edit-hint").textContent = hint;
  editor.value = JSON.stringify(config, null, 4);
  editorError.textContent = "";
  hideDryRun();
  setBookmarkStatus("");
  refreshModules();
  loadBookmarks();
  dialog.showModal();
  editor.focus();
  if (name === null) selectName(config.name);
}

// select the task name in the editor, so a new name can be typed right away
function selectName(name) {
  const text = JSON.stringify(name);
  const start = editor.value.indexOf('"name": ' + text);
  if (start < 0) return;
  const valueStart = start + '"name": '.length + 1;
  editor.setSelectionRange(valueStart, valueStart + text.length - 2);
}

function copyName(name) {
  let copy = name + "_copy";
  for (let i = 2; taskNames.has(copy); i++) copy = name + "_copy" + i;
  return copy;
}

async function openCopy(name) {
  try {
    const config = await api("GET", "/api/tasks/" + encodeURIComponent(name) + "/config");
    config.name = copyName(name);
    showEditor(null, "复制任务：" + name, "修改后保存为新任务，原任务不受影响（Ctrl+S）", config);
  } catch (e) {
    toast(e.message, true);
  }
}

async function openEditor(name) {
  try {
    const config = await api("GET", "/api/tasks/" + encodeURIComponent(name) + "/config");
    showEditor(name, "编辑任务：" + name, "保存后写入任务文件并立即生效（Ctrl+S）", config);
  } catch (e) {
    toast(e.message, true);
  }
}

document.getElementById("add-task").addEventListener("click", () => {
  showEditor(null, "新增任务", "保存后追加到任务文件并立即生效，未设置 running: false 时会马上运行一次（Ctrl+S）", NEW_TASK_TEMPLATE);
});

function parseEditor() {
  try {
    return JSON.parse(editor.value);
  } catch (e) {
    editorError.textContent = "JSON 格式错误：" + e.message;
    return undefined;
  }
}

document.getElementById("edit-format").addEventListener("click", () => {
  const config = parseEditor();
  if (config === undefined) return;
  editor.value = JSON.stringify(config, null, 4);
  editorError.textContent = "";
});

document.getElementById("edit-cancel").addEventListener("click", () => dialog.close());

async function saveEditor() {
  const config = parseEditor();
  if (config === undefined) return;
  const button = document.getElementById("edit-save");
  button.disabled = true;
  editorError.textContent = "";
  try {
    if (editingName === null) {
      await api("POST", "/api/tasks", config);
      toast("已新增：" + config.name);
    } else {
      await api("PUT", "/api/tasks/" + encodeURIComponent(editingName) + "/config", config);
      toast("已保存：" + (config.name || editingName));
    }
    dialog.close();
    await refresh();
  } catch (e) {
    editorError.textContent = "保存失败：" + e.message;
  } finally {
    button.disabled = false;
  }
}
document.getElementById("edit-save").addEventListener("click", saveEditor);

// ---------- bookmarks ----------

const KIND_ORDER = ["source", "data", "renderer", "condition", "push"];
const LIST_KINDS = ["data", "condition", "push"];   // can be appended to
const bmModule = document.getElementById("bm-module");
const bmName = document.getElementById("bm-name");
let moduleOptions = [];   // modules of the config in the editor: {kind, path, label}
let bookmarks = [];

function setBookmarkStatus(message, isError) {
  const node = document.getElementById("bm-status");
  node.textContent = message;
  node.className = isError ? "error" : "";
}

function typeLabel(value) {
  return value && typeof value === "object" && !Array.isArray(value) && value.type ? " · " + value.type : "";
}

function conditionLabel(condition) {
  if (!condition || typeof condition !== "object") return "";
  const text = ` · ${condition.var} ${condition.op} ${JSON.stringify(condition.target)}`;
  return text.length > 40 ? text.slice(0, 40) + "…" : text;
}

function isObject(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value);
}

// modules of a task config that can be bookmarked; whole lists are offered when they have more than one item
function listModules(task) {
  const options = [];
  if (isObject(task.source)) options.push({ kind: "source", path: ["source"], label: "source" + typeLabel(task.source) });
  for (const [kind, unit, label] of [["data", "项", typeLabel], ["condition", "条", conditionLabel]]) {
    if (!Array.isArray(task[kind])) continue;
    if (task[kind].length > 1) options.push({ kind, path: [kind], label: `${kind}（全部 ${task[kind].length} ${unit}）` });
    task[kind].forEach((item, i) => options.push({ kind, path: [kind, i], label: `${kind}[${i}]` + label(item) }));
  }
  if (isObject(task.renderer)) options.push({ kind: "renderer", path: ["renderer"], label: "renderer" + typeLabel(task.renderer) });
  if (Array.isArray(task.push)) {
    if (task.push.length > 1) options.push({ kind: "push", path: ["push"], label: `push（全部 ${task.push.length} 个）` });
    task.push.forEach((item, i) => options.push({ kind: "push", path: ["push", i], label: `push[${i}]` + typeLabel(item) }));
  } else if (isObject(task.push)) {
    options.push({ kind: "push", path: ["push"], label: "push" + typeLabel(task.push) });
  }
  return options;
}

// rebuild the module choices from the config in the editor
function refreshModules() {
  let task = null;
  try { task = JSON.parse(editor.value); } catch (e) { /* invalid while typing */ }
  const previous = bmModule.value;
  moduleOptions = isObject(task) ? listModules(task) : [];
  const placeholder = !isObject(task) ? "（配置 JSON 有误）" : moduleOptions.length ? null : "（没有可收藏的模块）";
  bmModule.replaceChildren(...(placeholder
    ? [el("option", { value: "" }, placeholder)]
    : moduleOptions.map(option => el("option", { value: option.path.join(".") }, option.label))));
  if (moduleOptions.some(option => option.path.join(".") === previous)) bmModule.value = previous;
  bmModule.disabled = !!placeholder;
  document.getElementById("bm-add").disabled = !!placeholder;
  updateNamePlaceholder();
}

function selectedModule() {
  return moduleOptions.find(option => option.path.join(".") === bmModule.value);
}

function updateNamePlaceholder() {
  const option = selectedModule();
  bmName.placeholder = option ? option.label : "书签名称";
}

let refreshModulesTimer = null;
editor.addEventListener("input", () => {
  clearTimeout(refreshModulesTimer);
  refreshModulesTimer = setTimeout(refreshModules, 300);
});
bmModule.addEventListener("change", updateNamePlaceholder);

async function addBookmark() {
  refreshModules();
  const option = selectedModule();
  if (!option) return;
  let value = JSON.parse(editor.value);
  for (const key of option.path) value = value[key];
  const name = bmName.value.trim() || option.label;
  try {
    await api("POST", "/api/bookmarks", { name, kind: option.kind, value });
    bmName.value = "";
    setBookmarkStatus("已收藏：" + name);
    await loadBookmarks();
  } catch (e) {
    setBookmarkStatus("收藏失败：" + e.message, true);
  }
}
document.getElementById("bm-add").addEventListener("click", addBookmark);
bmName.addEventListener("keydown", (event) => { if (event.key === "Enter") addBookmark(); });

async function loadBookmarks() {
  try {
    bookmarks = await api("GET", "/api/bookmarks");
  } catch (e) {
    bookmarks = [];
    setBookmarkStatus("书签加载失败：" + e.message, true);
  }
  renderBookmarks();
}

function renderBookmarks() {
  const list = document.getElementById("bm-list");
  if (!bookmarks.length) {
    list.replaceChildren(el("div", { class: "bm-empty" }, "还没有书签。在上方选择当前配置中的模块收藏后，新建或编辑任务时可以直接插入。"));
    return;
  }
  const sorted = [...bookmarks].sort((a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || a.created - b.created);
  list.replaceChildren(...sorted.map(bookmark => {
    const buttons = [];
    if (LIST_KINDS.includes(bookmark.kind)) {
      buttons.push(el("button", { title: `追加到 ${bookmark.kind}`, onclick: () => insertBookmark(bookmark, "append") }, "追加"));
    }
    buttons.push(el("button", { title: `替换整个 ${bookmark.kind}`, onclick: () => insertBookmark(bookmark, "replace") }, "替换"));
    buttons.push(el("button", { class: "danger", onclick: () => deleteBookmark(bookmark) }, "删除"));
    return el("div", { class: "bm-item" },
      el("div", { class: "bm-item-head" }, el("span", { class: "bm-name" }, bookmark.name), el("span", { class: "bm-kind" }, bookmark.kind)),
      el("div", { class: "bm-preview mono", title: JSON.stringify(bookmark.value, null, 2) }, JSON.stringify(bookmark.value)),
      el("div", { class: "bm-actions" }, ...buttons));
  }));
}

// replace the editor text as one edit, so Ctrl+Z can undo it
function setEditorText(text) {
  editor.focus();
  editor.select();
  if (!document.execCommand("insertText", false, text)) editor.value = text;
}

function insertBookmark(bookmark, mode) {
  let task;
  try {
    task = JSON.parse(editor.value);
  } catch (e) {
    setBookmarkStatus("配置 JSON 有误，无法插入：" + e.message, true);
    return;
  }
  if (!isObject(task)) {
    setBookmarkStatus("任务配置必须是 JSON 对象", true);
    return;
  }
  const value = JSON.parse(JSON.stringify(bookmark.value));
  const current = task[bookmark.kind];
  if (mode === "append") {
    const items = Array.isArray(value) ? value : [value];
    if (Array.isArray(current)) task[bookmark.kind] = current.concat(items);
    else if (isObject(current)) task[bookmark.kind] = [current, ...items];   // single push channel becomes a list
    else task[bookmark.kind] = items;
  } else {
    task[bookmark.kind] = ["data", "condition"].includes(bookmark.kind) && !Array.isArray(value) ? [value] : value;
  }
  setEditorText(JSON.stringify(task, null, 4));
  editorError.textContent = "";
  refreshModules();
  setBookmarkStatus(`已${mode === "append" ? "追加" : "替换"}：${bookmark.name}（Ctrl+Z 可撤销）`);
}

async function deleteBookmark(bookmark) {
  if (!confirm(`删除书签「${bookmark.name}」？`)) return;
  try {
    await api("DELETE", "/api/bookmarks/" + encodeURIComponent(bookmark.id));
    setBookmarkStatus("已删除：" + bookmark.name);
  } catch (e) {
    setBookmarkStatus("删除失败：" + e.message, true);
  }
  await loadBookmarks();
}

// ---------- dry run ----------

const DRY_RUN_STEPS = { url: "请求地址", source: "source 数据源", data: "data 数据解析", renderer: "renderer 渲染", condition: "condition 条件判断" };
const dryRunBox = document.getElementById("dry-run");

function hideDryRun() {
  dryRunBox.hidden = true;
  dryRunBox.replaceChildren();
  dryRunBox.parentElement.parentElement.classList.remove("has-result");
}

function showDryRun(...children) {
  dryRunBox.hidden = false;
  dryRunBox.replaceChildren(...children);
  dryRunBox.parentElement.parentElement.classList.add("has-result");
}

// short JSON text of a value for one line
function brief(value, max = 160) {
  const text = JSON.stringify(value);
  if (text === undefined) return String(value);
  return text.length > max ? text.slice(0, max) + "…" : text;
}

function line(...children) {
  return el("div", { class: "dr-line mono" }, ...children);
}

function stepBody(step, report) {
  switch (step) {
    case "url":
      return Object.entries(report.urls || {}).map(([key, value]) => line(key + ": " + value));
    case "source":
      if (!report.source) return [];
      return [
        line(`长度 ${report.source.length} 字符`),
        el("details", {},
          el("summary", { class: "sub" }, report.source.length > report.source.preview.length ? `原始数据（前 ${report.source.preview.length} 字符）` : "原始数据"),
          el("pre", { class: "dr-pre mono" }, report.source.preview)),
      ];
    case "data":
      return (report.data || []).map((item, i) => item.error
        ? line(`$${i} · ${item.type} → `, el("span", { class: "bad" }, item.error))
        : line(`$${i} · ${item.type} → ${brief(item.value)}`));
    case "renderer": {
      if (!report.renderer) return [];
      const lines = [line("输出 → " + brief(report.renderer.output))];
      if (report.renderer.error) lines.push(el("div", { class: "dr-line dr-warn" }, "渲染出错，输出为 [0]：" + report.renderer.error));
      return lines;
    }
    case "condition": {
      if (!report.condition) return [];
      const lines = report.condition.items.map((item, i) => {
        const operand = (expr, value) => typeof expr === "string" && /^[$#]\d+$|^\*timestamp$/.test(expr) ? `${expr}(${brief(value, 60)})` : brief(value, 60);
        const parts = [`${i + 1}. ${item.conn} · ${operand(item.var, item.var_value)} ${item.op} ${operand(item.target, item.target_value)} → `];
        if (item.skipped) parts.push(el("span", { class: "bad" }, "已跳过：" + item.skipped));
        else {
          parts.push(el("span", { class: item.result ? "good" : "bad" }, item.result ? "真" : "假"));
          if (item.error) parts.push(el("span", { class: "bad" }, "（出错：" + item.error + "）"));
        }
        return line(...parts);
      });
      if (!lines.length) lines.push(line("没有条件，每次都推送"));
      return lines;
    }
  }
  return [];
}

function renderDryRun(report, hasRenderer) {
  const steps = ["url", "source", "data", ...(hasRenderer ? ["renderer"] : []), "condition"];
  const failedAt = report.error ? steps.indexOf(report.step) : -1;
  let summary;
  if (report.error) summary = el("span", {}, `✗ 在「${DRY_RUN_STEPS[report.step] || report.step}」失败，正式运行时本轮会被跳过`);
  else if (report.condition.result) summary = el("span", {}, "✓ 满足条件，正式运行时会推送");
  else summary = el("span", {}, "– 不满足条件，正式运行时不会推送");
  const meta = el("span", { class: "dr-meta" },
    `用时 ${report.duration}s · #n 取自${report.history === "current" ? "该任务当前的历史数据" : "配置中的 startup_data"}`);
  const sections = steps.map((step, i) => {
    const state = failedAt < 0 || i < failedAt ? "" : i === failedAt ? " fail" : " skip";
    const children = [el("div", { class: "dr-head" }, DRY_RUN_STEPS[step] + (state === " skip" ? "：未执行" : ""))];
    if (state !== " skip") children.push(...stepBody(step, report));
    if (state === " fail") children.push(el("div", { class: "dr-line error-text" }, report.error));
    return el("div", { class: "dr-step" + state }, ...children);
  });
  showDryRun(el("div", { class: "dr-summary " + (report.error ? "fail" : report.condition.result ? "ok" : "") }, summary, meta), ...sections);
}

async function dryRun() {
  const config = parseEditor();
  if (config === undefined) return;
  if (!isObject(config)) {
    editorError.textContent = "任务配置必须是 JSON 对象";
    return;
  }
  editorError.textContent = "";
  const button = document.getElementById("edit-dry-run");
  button.disabled = true;
  button.textContent = "试运行中…";
  showDryRun(el("div", { class: "dr-summary" }, "试运行中…"));
  try {
    const report = await api("POST", "/api/dry-run", { task: config, name: editingName });
    renderDryRun(report, "renderer" in config);
  } catch (e) {
    showDryRun(el("div", { class: "dr-summary fail" }, "试运行失败：" + e.message));
  } finally {
    button.disabled = false;
    button.textContent = "试运行";
  }
}
document.getElementById("edit-dry-run").addEventListener("click", dryRun);

editor.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    dryRun();
  } else if ((event.ctrlKey || event.metaKey) && event.key === "s") {
    event.preventDefault();
    saveEditor();
  } else if (event.key === "Tab") {
    event.preventDefault();
    editor.setRangeText("    ", editor.selectionStart, editor.selectionEnd, "end");
  }
});

refresh();
</script>
